name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (github channel)
        run: flutter build apk --release --dart-define=APP_CHANNEL=github

      - name: Rename artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             zremote-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: zremote-${{ github.ref_name }}.apk

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=APP_CHANNEL=appstore

      - name: Pack Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/zremote-${{ github.ref_name }}-ios-unsigned.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: zremote-${{ github.ref_name }}-ios-unsigned.zip

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
